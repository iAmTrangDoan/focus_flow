version: '3.9'

services:
  backend:
    build:
      context: ./backend
    command: npm run start:dev
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules          # Bảo vệ node_modules trong container
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules          # Bảo vệ node_modules trong container
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend